name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *" # se regenera todos los días a las 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: adrian0511
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%2300F7FF&color_dots=%2321262d,%23161b22,%2321262d,%23196127,%2300F7FF

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
