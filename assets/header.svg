<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200" role="img" aria-label="Adrián Garcés — Backend Developer">
  <title>Adrián Garcés — Backend Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041027"/>
      <stop offset="55%" stop-color="#062B63"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="200" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="200" fill="url(#bg)"/>

    <!-- olas: el path mide el doble de ancho y se desplaza -W para encadenar sin saltos -->
    <g opacity=".22" fill="#00F7FF">
      <path d="M 0.0 150.0 L 25.0 156.5 L 50.0 161.3 L 75.0 163.0 L 100.0 161.3 L 125.0 156.5 L 150.0 150.0 L 175.0 143.5 L 200.0 138.7 L 225.0 137.0 L 250.0 138.7 L 275.0 143.5 L 300.0 150.0 L 325.0 156.5 L 350.0 161.3 L 375.0 163.0 L 400.0 161.3 L 425.0 156.5 L 450.0 150.0 L 475.0 143.5 L 500.0 138.7 L 525.0 137.0 L 550.0 138.7 L 575.0 143.5 L 600.0 150.0 L 625.0 156.5 L 650.0 161.3 L 675.0 163.0 L 700.0 161.3 L 725.0 156.5 L 750.0 150.0 L 775.0 143.5 L 800.0 138.7 L 825.0 137.0 L 850.0 138.7 L 875.0 143.5 L 900.0 150.0 L 925.0 156.5 L 950.0 161.3 L 975.0 163.0 L 1000.0 161.3 L 1025.0 156.5 L 1050.0 150.0 L 1075.0 143.5 L 1100.0 138.7 L 1125.0 137.0 L 1150.0 138.7 L 1175.0 143.5 L 1200.0 150.0 L 1225.0 156.5 L 1250.0 161.3 L 1275.0 163.0 L 1300.0 161.3 L 1325.0 156.5 L 1350.0 150.0 L 1375.0 143.5 L 1400.0 138.7 L 1425.0 137.0 L 1450.0 138.7 L 1475.0 143.5 L 1500.0 150.0 L 1525.0 156.5 L 1550.0 161.3 L 1575.0 163.0 L 1600.0 161.3 L 1625.0 156.5 L 1650.0 150.0 L 1675.0 143.5 L 1700.0 138.7 L 1725.0 137.0 L 1750.0 138.7 L 1775.0 143.5 L 1800.0 150.0 L 1825.0 156.5 L 1850.0 161.3 L 1875.0 163.0 L 1900.0 161.3 L 1925.0 156.5 L 1950.0 150.0 L 1975.0 143.5 L 2000.0 138.7 L 2025.0 137.0 L 2025.0 260 L 0 260 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity=".16" fill="#3D8BFF">
      <path d="M 0.0 185.0 L 35.0 179.8 L 70.0 171.5 L 105.0 162.2 L 140.0 154.4 L 175.0 150.3 L 210.0 151.0 L 245.0 156.2 L 280.0 164.5 L 315.0 173.8 L 350.0 181.6 L 385.0 185.7 L 420.0 185.0 L 455.0 179.8 L 490.0 171.5 L 525.0 162.2 L 560.0 154.4 L 595.0 150.3 L 630.0 151.0 L 665.0 156.2 L 700.0 164.5 L 735.0 173.8 L 770.0 181.6 L 805.0 185.7 L 840.0 185.0 L 875.0 179.8 L 910.0 171.5 L 945.0 162.2 L 980.0 154.4 L 1015.0 150.3 L 1050.0 151.0 L 1085.0 156.2 L 1120.0 164.5 L 1155.0 173.8 L 1190.0 181.6 L 1225.0 185.7 L 1260.0 185.0 L 1295.0 179.8 L 1330.0 171.5 L 1365.0 162.2 L 1400.0 154.4 L 1435.0 150.3 L 1470.0 151.0 L 1505.0 156.2 L 1540.0 164.5 L 1575.0 173.8 L 1610.0 181.6 L 1645.0 185.7 L 1680.0 185.0 L 1715.0 179.8 L 1750.0 171.5 L 1785.0 162.2 L 1820.0 154.4 L 1855.0 150.3 L 1890.0 151.0 L 1925.0 156.2 L 1960.0 164.5 L 1995.0 173.8 L 2030.0 181.6 L 2035.0 260 L 0 260 Z">
        <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="23s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- puntos flotantes -->
    <g fill="#7FE9FF">
      <circle cx="90" cy="52" r="2.4" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="0.0s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="188" cy="148" r="1.8" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="1.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="1.3s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="300" cy="40" r="1.6" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="2.6s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="802" cy="60" r="2.2" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="0.7s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="886" cy="132" r="1.7" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="2.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="2.1s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="712" cy="32" r="1.5" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="3.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="3.4s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="940" cy="78" r="2.0" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="1.6s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="120" cy="112" r="1.4" opacity=".55">
        <animate attributeName="opacity" values=".15;.75;.15" dur="4.5s" begin="4.0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" begin="4.0s" repeatCount="indefinite" additive="sum"/>
      </circle>
    </g>

    <g font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Roboto,Ubuntu,Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="50%" y="88" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-.5">
        Adrián Garcés
        <animate attributeName="opacity" values="0;1" dur=".7s" fill="freeze"/>
      </text>
      <text x="50%" y="122" font-size="17" font-weight="500" fill="#9FD8FF" letter-spacing=".6">
        Backend Developer · Sistemas Distribuidos · Java &amp; Spring
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.3;1" dur="1.1s" fill="freeze"/>
      </text>
    </g>

    <rect x="330" y="140" width="340" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
      <animate attributeName="width" values="0;340" keyTimes="0;1" dur="1.1s" fill="freeze"/>
      <animate attributeName="x" values="500;330" keyTimes="0;1" dur="1.1s" fill="freeze"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="999" height="199" rx="16" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>
</svg>
